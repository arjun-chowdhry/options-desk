# Continuous integration: on every push, to any branch, lint and run the full test suite.
#
# - Python comes from .python-version (the same file the project's venv follows), so CI and
#   the laptop run the same version.
# - The network is used only to install packages. The tests themselves are offline:
#   tests/conftest.py refuses every outbound connection and DNS lookup, so a test that
#   tried to reach yfinance would fail here, loudly.
# - The test suite takes ~2.5 minutes locally; the timeout leaves plenty of margin.

name: CI

on:
  push:
  workflow_dispatch: # also allow a manual run from the Actions tab

permissions:
  contents: read

concurrency: # a newer push to the same branch cancels the older, still-running check
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format (ruff format --check)
        run: ruff format --check .

      - name: Tests (pytest, offline)
        run: pytest
